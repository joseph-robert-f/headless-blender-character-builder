[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "headless-blender-character-builder-service"
version = "0.1.0"
description = "Durable service adapters for Headless Blender Character Builder."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "async-timeout==5.0.1",
  "fastapi==0.141.1",
  "minio==7.2.20",
  "psycopg[binary]==3.3.4",
  "redis==8.1.0",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
test = ["httpx2==2.12.0"]

[project.scripts]
hbcb-api = "hbcb_service.api_main:main"
hbcb-initialize = "hbcb_service.initialize_main:main"
hbcb-migrate = "hbcb_service.migrate_main:main"
hbcb-worker = "hbcb_service.worker_main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hbcb_service*"]

[tool.setuptools.package-data]
hbcb_service = ["migrations/*.sql"]
