version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      safe-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: "/service"
    schedule:
      interval: weekly
      day: monday
      time: "09:10"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps-service
    groups:
      safe-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    allow:
      - dependency-name: postgres
      - dependency-name: redis
    commit-message:
      prefix: deps-compose

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps-images

# GitHub Actions remain full-SHA pinned and maintainer-updated. Dependabot can
# parse, but cannot safely rewrite, the repository's dependency-free JSON-form
# YAML workflows.
