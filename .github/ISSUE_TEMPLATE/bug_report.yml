name: Bug report
description: Report a repeatable defect in a supported v0.1 workflow. Do not include sensitive data.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Do not include vulnerabilities, credentials, private references,
        personal data, exploit details, or signed artifact URLs here.
        For a possible security issue, use the procedure in SECURITY.md.
  - type: dropdown
    id: surface
    attributes:
      label: Affected path
      options:
        - Keyless single-container demo
        - Native Blender CLI
        - Local Compose service
        - VPS reference deployment
        - Documentation or packaging
        - Other supported v0.1 path
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or source revision
      description: Release tag, commit SHA, or source revision from the manifest.
      placeholder: v0.1.0 or full commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste output from ./scripts/doctor (or --service/--native) without sensitive data. Add CPU/RAM and the applicable mode. Examine the output before publication.
      placeholder: |
        ./scripts/doctor output:
        CPU/RAM:
        Mode:
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the smallest repeatable procedure. If applicable, include a request within the permitted limits and without sensitive data.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exit code, status, and error text without sensitive data. Do not paste secrets or signed URLs.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include applicable manifest fields, QA fields, hashes, or log parts. Remove tokens, endpoints, names, and private content.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I reproduced this problem in a supported workflow with the smallest practical request.
          required: true
        - label: I removed credentials, private data, signed URLs, and material I cannot redistribute.
          required: true
        - label: This is not a private security vulnerability report.
          required: true
