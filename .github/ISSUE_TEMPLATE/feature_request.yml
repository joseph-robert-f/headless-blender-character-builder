# SPDX-License-Identifier: GPL-3.0-or-later

name: Feature request
description: Propose an improvement with a fixed scope or an identified extension after v0.1.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the implementation.
        v0.1 excludes arbitrary Blender code, uploaded files, remote input,
        prompt planning/MCP, GPU orchestration, public multi-tenancy, and print guarantees.
        Identify a proposal for those features as work after v0.1.
        Include a security-boundary analysis.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Identify the user and the supported task that cannot proceed.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Proposed scope
      options:
        - Bounded v0.1 correction or improvement
        - New backward-compatible v0.1 capability
        - Post-v0.1 extension
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - CharacterSpec or BuildRequest contract
        - Generator or component
        - Exporter or renderer
        - Geometry QA
        - API or service lifecycle
        - Deployment or operations
        - Security, licensing, or governance
        - Documentation or developer experience
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest stable contract. Explain how old requests keep their meaning.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: If applicable, include an alternative with no change or only a documentation change.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary changes
      description: Select each area that this proposal expands.
      options:
        - label: Accepted files, paths, URLs, archives, or reference assets
        - label: Python/Blender execution, add-ons, drivers, nodes, or commands
        - label: Network access, callbacks, provider APIs, MCP, or credentials
        - label: Storage/IAM, artifact publication, tenancy, or public ingress
        - label: GPU/device access, concurrency, or resource limits
        - label: Output/IP claims, slicer behavior, or physical-print claims
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, licensing, and compatibility impact
      description: Explain new threats, rights requirements, migration, versions, tests, and documentation. Write “none” only after an assessment.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I will not attach credentials, private references, signed URLs, or material I cannot redistribute.
          required: true
        - label: I understand that geometry QA does not give legal clearance or a physical-print guarantee.
          required: true
