{
  "name": "Release candidate verification",
  "on": {"workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "concurrency": {
    "group": "release-candidate-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "release-check": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 360,
      "steps": [
        {
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {"persist-credentials": false, "fetch-depth": 0}
        },
        {
          "env": {
            "HBCB_RELEASE_RUN_ID": "github-${{ github.run_id }}-${{ github.run_attempt }}"
          },
          "name": "Full clean-index release gate",
          "run": "make release-check"
        },
        {
          "name": "Retain checksum-verified release evidence",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "compression-level": 0,
            "if-no-files-found": "error",
            "name": "release-candidate-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "build/release-check/github-${{ github.run_id }}-${{ github.run_attempt }}",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
