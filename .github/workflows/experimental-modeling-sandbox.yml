{
  "name": "Experimental modeling sandbox",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "trial_mode": {
          "description": "Offline tests by default. Live proposal requires reviewed setup and a fresh owner approval.",
          "type": "choice",
          "options": [
            "offline",
            "live-propose"
          ],
          "default": "offline",
          "required": true
        },
        "reviewed_commit": {
          "description": "Exact independently reviewed 40-character commit for live proposal",
          "type": "string",
          "default": "",
          "required": false
        },
        "request_sha256": {
          "description": "Exact reviewed outbound payload SHA-256",
          "type": "string",
          "default": "",
          "required": false
        },
        "setup_confirmation": {
          "description": "Enter protected-provider-environment-verified only after checking actual environment protection rules",
          "type": "string",
          "default": "",
          "required": false
        }
      }
    },
    "pull_request": {
      "paths": [
        "experimental_modeling/**",
        "tests/experimental_modeling/**",
        ".github/workflows/experimental-modeling-sandbox.yml",
        "tests/review_ui/**"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ inputs.trial_mode == 'live-propose' && 'hbcb-fixed-live-lamp-trial' || format('modeling-sandbox-{0}', github.ref) }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "docker-boundary-and-benchmark": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 120,
      "steps": [
        {
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Build existing pinned builder image without publishing",
          "run": "docker build --target builder -f docker/builder.Dockerfile -t modeling-sandbox-test ."
        },
        {
          "name": "Resolve immutable local image identity",
          "run": "echo \"MODELING_SANDBOX_IMAGE=$(docker image inspect --format '{{.Id}}' modeling-sandbox-test)\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Fail-closed static tests and live container boundary smoke",
          "run": "python3 -m unittest discover -s tests/experimental_modeling -v"
        },
        {
          "name": "Full robot revisions through separate sandbox stages",
          "run": "python3 tests/experimental_modeling/run_benchmark.py --store \"$RUNNER_TEMP/modeling-benchmark\" --sandbox-image \"$MODELING_SANDBOX_IMAGE\""
        },
        {
          "name": "Independent desk-creature revisions through sandbox stages",
          "run": "python3 tests/experimental_modeling/run_desk_creature.py --store \"$RUNNER_TEMP/modeling-desk-benchmark\" --sandbox-image \"$MODELING_SANDBOX_IMAGE\""
        },
        {
          "name": "Anime cat accessory revisions and rejected edit through sandbox stages",
          "run": "python3 tests/experimental_modeling/run_anime_cat.py --store \"$RUNNER_TEMP/modeling-anime-cat\" --sandbox-image \"$MODELING_SANDBOX_IMAGE\""
        },
        {
          "name": "Reusable relation positive and negative Blender fixtures",
          "run": "python3 tests/experimental_modeling/run_water_relations.py --store \"$RUNNER_TEMP/modeling-water-relations\" --sandbox-image \"$MODELING_SANDBOX_IMAGE\""
        },
        {
          "name": "Locked-rule controller and aggregate preservation integration",
          "run": "python3 tests/experimental_modeling/run_review_project.py --store \"$RUNNER_TEMP/modeling-review-project\" --sandbox-image \"$MODELING_SANDBOX_IMAGE\""
        },
        {
          "name": "Explicit request bridge through real isolated stages",
          "run": "python3 tests/experimental_modeling/run_request_bridge.py --output \"$RUNNER_TEMP/modeling-request-bridge\" --sandbox-image \"$MODELING_SANDBOX_IMAGE\" --docker \"$(command -v docker)\" --docker-socket /run/docker.sock"
        },
        {
          "name": "Recorded external assistant lamp through the isolated request bridge",
          "run": "python3 tests/experimental_modeling/run_external_lamp.py --output \"$RUNNER_TEMP/modeling-external-lamp\" --sandbox-image \"$MODELING_SANDBOX_IMAGE\" --docker \"$(command -v docker)\" --docker-socket /run/docker.sock"
        },
        {
          "name": "Version-2 verifier golden cases and independent Blender artifacts",
          "run": "python3 tests/experimental_modeling/run_verifier_validation.py --store \"$RUNNER_TEMP/modeling-verifier-validation\" --sandbox-image \"$MODELING_SANDBOX_IMAGE\" --docker \"$(command -v docker)\" --docker-socket /run/docker.sock"
        },
        {
          "name": "Install pinned browser QA tools",
          "run": "npm ci --prefix tests/review_ui --ignore-scripts --omit=optional\ntests/review_ui/node_modules/.bin/playwright install --with-deps chromium"
        },
        {
          "name": "Local review browser integration and screenshots",
          "env": {
            "NODE_PATH": "${{ github.workspace }}/tests/review_ui/node_modules",
            "PYTHON": "python3",
            "MODELING_REVIEW_QA_STORE": "${{ runner.temp }}/modeling-benchmark/primary",
            "MODELING_REVIEW_QA_OUTPUT": "${{ runner.temp }}/modeling-review-ui"
          },
          "run": "node tests/experimental_modeling/review_ui_qa.cjs"
        },
        {
          "name": "Locked requirements browser evidence and acceptance gating",
          "env": {
            "NODE_PATH": "${{ github.workspace }}/tests/review_ui/node_modules",
            "PYTHON": "python3",
            "MODELING_REVIEW_QA_STORE": "${{ runner.temp }}/modeling-review-project/project",
            "MODELING_REVIEW_QA_OUTPUT": "${{ runner.temp }}/modeling-review-ui"
          },
          "run": "node tests/experimental_modeling/review_water_ui_qa.cjs"
        },
        {
          "name": "Request result links and separate acceptance in the browser",
          "env": {
            "NODE_PATH": "${{ github.workspace }}/tests/review_ui/node_modules",
            "PYTHON": "python3",
            "MODELING_REQUEST_QA_STORE": "${{ runner.temp }}/modeling-request-bridge/project/evidence",
            "MODELING_REVIEW_QA_OUTPUT": "${{ runner.temp }}/modeling-review-ui"
          },
          "run": "node tests/experimental_modeling/review_request_ui_qa.cjs"
        },
        {
          "name": "Verifier version labels in the review browser",
          "env": {
            "NODE_PATH": "${{ github.workspace }}/tests/review_ui/node_modules",
            "PYTHON": "python3",
            "MODELING_V1_QA_STORE": "${{ runner.temp }}/modeling-benchmark/primary",
            "MODELING_V2_QA_STORE": "${{ runner.temp }}/modeling-verifier-validation/tetra",
            "MODELING_REVIEW_QA_OUTPUT": "${{ runner.temp }}/modeling-review-ui"
          },
          "run": "node --test tests/experimental_modeling/test_review_verifier_ui_readiness.cjs\nnode tests/experimental_modeling/review_verifier_ui_qa.cjs"
        },
        {
          "name": "Explicit authoring workbench browser and real isolated lamp",
          "env": {
            "NODE_PATH": "${{ github.workspace }}/tests/review_ui/node_modules",
            "PYTHON": "python3",
            "MODELING_WORKBENCH_QA_OUTPUT": "${{ runner.temp }}/modeling-workbench-ui"
          },
          "run": "MODELING_WORKBENCH_QA_DOCKER=\"$(readlink -f \"$(command -v docker)\")\" node tests/experimental_modeling/workbench_ui_qa.cjs"
        },
        {
          "name": "BYOK mocked provider browser to real isolated Blender evidence",
          "env": {
            "NODE_PATH": "${{ github.workspace }}/tests/review_ui/node_modules",
            "PYTHON": "python3",
            "MODELING_BYOK_QA_OUTPUT": "${{ runner.temp }}/modeling-byok-ui"
          },
          "run": "MODELING_BYOK_QA_DOCKER=\"$(readlink -f \"$(command -v docker)\")\" node tests/experimental_modeling/byok_ui_qa.cjs"
        },
        {
          "name": "Create bounded verifier proof archive",
          "id": "verifier_proof",
          "if": "${{ always() }}",
          "run": "python3 tests/experimental_modeling/pack_verifier_evidence.py --root \"$RUNNER_TEMP\" --output \"$RUNNER_TEMP/verifier-proof.zip\""
        },
        {
          "name": "Retain bounded verifier proof",
          "if": "${{ always() && steps.verifier_proof.outcome == 'success' }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "verifier-proof-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/verifier-proof.zip",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Check and bind dedicated BYOK evidence",
          "id": "byok_proof",
          "if": "${{ always() }}",
          "run": "python3 - <<'PYCODE'\nimport hashlib, json, os, stat, subprocess\nfrom pathlib import Path\nroot = Path(os.environ['RUNNER_TEMP']) / 'modeling-byok-ui'\nif not root.is_dir() or root.is_symlink():\n    raise SystemExit('No BYOK evidence directory was produced.')\nfiles, total = {}, 0\nfor path in sorted(root.rglob('*')):\n    info = path.lstat()\n    if stat.S_ISDIR(info.st_mode):\n        continue\n    if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:\n        raise SystemExit('BYOK proof contains a linked or special file.')\n    total += info.st_size\n    if len(files) >= 2048 or total > 24 * 1024 * 1024:\n        raise SystemExit('BYOK proof exceeds the dedicated artifact limit.')\n    data = path.read_bytes()\n    if len(data) != info.st_size:\n        raise SystemExit('BYOK proof changed during packing.')\n    files[path.relative_to(root).as_posix()] = {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}\nmanifest = {'schema_version': 1, 'scope': 'Mock HTTP provider and real isolated Blender evidence; no live API or credential',\n            'checked_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),\n            'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),\n            'uncompressed_bytes': total, 'files': files}\nwith (root / 'proof-manifest.json').open('x') as stream:\n    json.dump(manifest, stream, indent=2, sort_keys=True)\n    stream.write('\\n')\nprint(json.dumps({'files': len(files), 'bytes': total, 'source_tree': manifest['source_tree']}))\nPYCODE"
        },
        {
          "name": "Retain bounded BYOK evidence",
          "if": "${{ always() && steps.byok_proof.outcome == 'success' }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "byok-proof-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/modeling-byok-ui",
            "if-no-files-found": "error",
            "retention-days": 7,
            "include-hidden-files": true
          }
        },
        {
          "name": "Retain bounded experimental evidence",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "modeling-evidence-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/modeling-benchmark\n${{ runner.temp }}/modeling-desk-benchmark\n${{ runner.temp }}/modeling-review-ui\n${{ runner.temp }}/modeling-water-relations\n${{ runner.temp }}/modeling-review-project\n${{ runner.temp }}/modeling-request-bridge\n${{ runner.temp }}/modeling-verifier-validation\n${{ runner.temp }}/modeling-workbench-ui",
            "if-no-files-found": "ignore",
            "retention-days": 7,
            "include-hidden-files": true
          }
        },
        {
          "name": "Retain compact anime cat review evidence",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "anime-cat-review-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/modeling-anime-cat/anime-cat-summary.json\n${{ runner.temp }}/modeling-anime-cat/primary/last_good.json\n${{ runner.temp }}/modeling-anime-cat/primary/attempts/bad-base/result.json\n${{ runner.temp }}/modeling-anime-cat/primary/accepted/r*/result.json\n${{ runner.temp }}/modeling-anime-cat/primary/accepted/r*/inspection/views/*.png\n${{ runner.temp }}/modeling-anime-cat/primary/accepted/r*/inspection/observation.json\n${{ runner.temp }}/modeling-anime-cat/primary/accepted/r*/inspection/scene.blend\n${{ runner.temp }}/modeling-anime-cat/primary/accepted/r*/inspection/model.glb\n${{ runner.temp }}/modeling-anime-cat/primary/attempts/*/result.json\n${{ runner.temp }}/modeling-anime-cat/primary/attempts/*/*.log\n${{ runner.temp }}/modeling-anime-cat/clean-rebuild/accepted/rebuild/result.json",
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        },
        {
          "name": "Retain external author lamp evidence",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "external-lamp-evidence-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/modeling-external-lamp",
            "if-no-files-found": "ignore",
            "retention-days": 7,
            "include-hidden-files": true
          }
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || inputs.trial_mode != 'live-propose' }}"
    },
    "live-lamp-proposal": {
      "if": "${{ github.event_name == 'workflow_dispatch' && inputs.trial_mode == 'live-propose' && github.repository == 'joseph-robert-f/headless-blender-character-builder' && github.ref == 'refs/heads/experimental/live-openai-lamp' && github.actor == 'joseph-robert-f' && github.triggering_actor == 'joseph-robert-f' && github.run_attempt == 1 }}",
      "name": "Authorize one live OpenAI request",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "environment": {
        "name": "hbcb-live-provider"
      },
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "env": {
        "TRIAL_MODE": "${{ inputs.trial_mode }}",
        "TRIAL_REVIEWED_COMMIT": "${{ inputs.reviewed_commit }}",
        "TRIAL_REQUEST_SHA256": "${{ inputs.request_sha256 }}",
        "TRIAL_SETUP_CONFIRMATION": "${{ inputs.setup_confirmation }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Require exact reviewed source and fixed outbound payload",
          "run": "test \"$(git rev-parse HEAD)\" = \"$TRIAL_REVIEWED_COMMIT\"\npython3 tests/experimental_modeling/live_openai_trial.py preview"
        },
        {
          "name": "Fail closed on missing protections or prior live attempt",
          "env": {
            "TRIAL_GITHUB_READ_TOKEN": "${{ github.token }}"
          },
          "run": "python3 tests/experimental_modeling/live_openai_trial.py preflight --output \"$RUNNER_TEMP/hbcb-live-trial\""
        },
        {
          "name": "Send one approved fixed request; never execute its output",
          "id": "propose",
          "env": {
            "HBCB_OPENAI_TRIAL_KEY": "${{ secrets.HBCB_OPENAI_TRIAL_KEY }}"
          },
          "run": "python3 tests/experimental_modeling/live_openai_trial.py propose --output \"$RUNNER_TEMP/hbcb-live-trial\""
        },
        {
          "name": "Check that the bounded artifact was finalized",
          "id": "artifact",
          "if": "${{ always() && steps.propose.outcome != 'skipped' }}",
          "run": "if test -f \"$RUNNER_TEMP/hbcb-live-trial/public/artifact-manifest.json\"; then echo \"ready=true\" >> \"$GITHUB_OUTPUT\"; fi"
        },
        {
          "name": "Retain bounded inert proposal and safe status",
          "if": "${{ always() && steps.artifact.outputs.ready == 'true' }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "live-lamp-proposal-${{ github.run_id }}-1",
            "path": "${{ runner.temp }}/hbcb-live-trial/public",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  },
  "run-name": "${{ inputs.trial_mode == 'live-propose' && format('HBCB live lamp proposal {0}', github.sha) || 'Experimental modeling sandbox' }}"
}
