{
  "name": "Dependency audit",
  "on": {
    "schedule": [
      {"cron": "23 13 * * 1"}
    ],
    "workflow_dispatch": {}
  },
  "permissions": {"contents": "read"},
  "concurrency": {
    "group": "dependency-audit-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "audit": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 180,
      "steps": [
        {
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {"persist-credentials": false}
        },
        {
          "id": "scan",
          "name": "Audit dependency policy, freshness, and vulnerabilities",
          "run": "set +e\n./scripts/dependency-scan --output build/dependency-audit --images\nscan_status=$?\nset -e\nif test -f build/dependency-audit/scan-summary.md; then\n  cat build/dependency-audit/scan-summary.md >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  printf '%s\\n' '# Networked dependency scan' '' 'Status: **incomplete**' >> \"$GITHUB_STEP_SUMMARY\"\n  scan_status=2\nfi\nprintf 'status=%s\\n' \"$scan_status\" >> \"$GITHUB_OUTPUT\"\nexit 0"
        },
        {
          "if": "${{ always() }}",
          "name": "Retain bounded audit reports",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "if-no-files-found": "error",
            "name": "dependency-audit-${{ github.run_id }}",
            "path": "build/dependency-audit",
            "retention-days": 7
          }
        },
        {
          "env": {"SCAN_STATUS": "${{ steps.scan.outputs.status }}"},
          "if": "${{ always() }}",
          "name": "Enforce complete vulnerability result",
          "run": "case \"$SCAN_STATUS\" in\n  0) printf '%s\\n' 'DEPENDENCY_AUDIT: PASS' ;;\n  1) printf '%s\\n' 'DEPENDENCY_AUDIT: FINDINGS' >&2; exit 1 ;;\n  *) printf '%s\\n' 'DEPENDENCY_AUDIT: INCOMPLETE' >&2; exit 1 ;;\nesac"
        },
        {
          "if": "${{ always() }}",
          "name": "Enforce disposition expiry runway",
          "run": "python3 - <<'PY'\nimport datetime\nimport json\nimport sys\n\nTHRESHOLD_DAYS = 14\ntry:\n    with open(\"release/vulnerability-policy.json\", encoding=\"utf-8\") as stream:\n        document = json.load(stream)\nexcept (OSError, ValueError):\n    print(\"DEPENDENCY_AUDIT: DISPOSITION INVENTORY INVALID\", file=sys.stderr)\n    raise SystemExit(1)\ndispositions = document.get(\"dispositions\") if isinstance(document, dict) else None\nif not isinstance(dispositions, list) or not dispositions:\n    print(\"DEPENDENCY_AUDIT: DISPOSITION INVENTORY INVALID\", file=sys.stderr)\n    raise SystemExit(1)\ndates = []\nfor item in dispositions:\n    try:\n        dates.append(datetime.date.fromisoformat(str(item.get(\"expires_on\"))))\n    except ValueError:\n        print(\"DEPENDENCY_AUDIT: DISPOSITION EXPIRY INVALID\", file=sys.stderr)\n        raise SystemExit(1)\nearliest = min(dates)\nremaining = (earliest - datetime.date.today()).days\nmarker = \"earliest disposition expiry \" + earliest.isoformat() + \" in \" + str(remaining) + \" days\"\nif remaining < 0:\n    print(\"DEPENDENCY_AUDIT: DISPOSITIONS EXPIRED (\" + marker + \")\", file=sys.stderr)\n    raise SystemExit(1)\nif remaining <= THRESHOLD_DAYS:\n    print(\"DEPENDENCY_AUDIT: DISPOSITIONS EXPIRE SOON (\" + marker + \")\", file=sys.stderr)\n    raise SystemExit(1)\nprint(\"DEPENDENCY_AUDIT: DISPOSITION RUNWAY OK (\" + marker + \")\")\nPY"
        }
      ]
    }
  }
}
