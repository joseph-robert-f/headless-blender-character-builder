name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    # The unit suite is stdlib-only and needs no Blender, so it runs on every
    # supported Python and gives feedback in well under a minute.
    name: unit (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install check dependencies
        run: python -m pip install --upgrade pip jsonschema
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -t . -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .
      - run: ruff format --check .

  blender:
    # Blender itself only runs here. bpy publishes cp311 wheels, so the job is
    # pinned to 3.11 regardless of what the unit matrix covers.
    name: blender integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Blender as a Python module
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bpy==4.5.12"
      - name: Geometry and artifact tests
        run: python hbcb-cli selftest
      - name: Build and verify every preset
        run: |
          set -euo pipefail
          for preset in $(python hbcb-cli presets | awk '/^  [a-z]/ {print $1}'); do
            echo "::group::$preset"
            python hbcb-cli build --preset "$preset" --no-renders -o "build/$preset"
            python hbcb-cli verify "build/$preset"
            echo "::endgroup::"
          done
      - name: Build one preset with renders
        run: |
          python hbcb-cli build --preset facet-bot -o build/rendered
          python hbcb-cli verify build/rendered
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: build/
          retention-days: 7

  container:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            -f docker/builder.Dockerfile \
            --build-arg PROJECT_REVISION=${{ github.sha }} \
            -t hbcb:ci .
      - name: Build a model with no network access
        run: |
          mkdir -p out
          docker run --rm \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/out:/output" \
            hbcb:ci build --preset facet-bot --no-renders -o /output
      - name: Check the expected artifacts exist
        run: |
          set -euo pipefail
          for file in model.stl model.blend qa.json manifest.json; do
            test -s "out/$file" || { echo "missing out/$file"; exit 1; }
          done
          python -c "import json;d=json.load(open('out/manifest.json'));assert d['status']=='succeeded',d['status'];print('status',d['status'],'| triangles',d['model']['triangles'])"
