[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "headless-blender-character-builder"
version = "0.1.0"
description = "Deterministic headless Blender character generation with verified 3D artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[project.scripts]
builder = "builder_cli.__main__:entrypoint"

[project.optional-dependencies]
test = [
  "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
include = ["blender*", "builder_cli*", "shared*"]
exclude = ["tests*"]
